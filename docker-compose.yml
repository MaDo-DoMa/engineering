services:
  postgres:
    image: postgres:15
    container_name: shop-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etf_db
    ports:
      - "5432:5432"

  java-backend:
    build:
      context: ./engineer-backend-api
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    env_file:
      - ./engineer-backend-api/.env
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/etf_db
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=password
      - ML_SERVICE_URL=http://python-ml:8000
      # TIINGO_API_KEY intentionally NOT set here: the compose variable
      # ${TIINGO_API_KEY} resolves to an empty string when it is missing from
      # the shell and would clobber the real key from env_file (.env).
    depends_on:
      - postgres

  python-ml:
    build:
      context: ./engineer-backend-llm
    ports:
      - "8000:8000"
    # DEV: source code is bind-mounted into the container, so code edits are
    # visible after a simple `docker compose restart python-ml` - no rebuild
    # and no image change required (pip deps live outside /app, so they
    # are not shadowed by this mount).
    volumes:
      - ./engineer-backend-llm:/app

  frontend:
    build:
      context: ./frontend
    container_name: shop-frontend
    ports:
      - "8501:8501"
    # DEV: source code is bind-mounted into the container, so app.py edits are
    # visible after a simple `docker compose restart frontend` - no rebuild
    # required (pip deps live in site-packages, not in /app).
    volumes:
      - ./frontend:/app
    environment:
      - JAVA_API_BASE_URL=http://java-backend:8080
      - ML_API_BASE_URL=http://python-ml:8000
    depends_on:
      - java-backend
      - python-ml
