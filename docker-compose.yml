services:
  postgres:
    image: postgres:15
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etf_db
    ports:
      - "5432:5432"
    # Named volume: Tiingo price history SURVIVES `docker compose down`,
    # container recreation and Docker Desktop restarts. (Anonymous container
    # storage was the cause of the recurring empty-database incidents.)
    volumes:
      - postgres_data:/var/lib/postgresql/data

  java-backend:
    build:
      context: ./engineer-backend-api
      dockerfile: src/main/docker/Dockerfile.jvm
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./engineer-backend-api/.env
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/etf_db
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=password
      - ML_SERVICE_URL=http://python-ml:8000
      # TIINGO_API_KEY intentionally NOT set here: the compose variable
      # ${TIINGO_API_KEY} resolves to an empty string when it is missing from
      # the shell and would clobber the real key from env_file (.env).
    depends_on:
      - postgres

  python-ml:
    build:
      context: ./engineer-backend-llm
    restart: unless-stopped
    ports:
      - "8000:8000"
    # DEV: source code is bind-mounted into the container, so code edits are
    # visible after a simple `docker compose restart python-ml` - no rebuild
    # and no image change required (pip deps live outside /app, so they
    # are not shadowed by this mount).
    volumes:
      - ./engineer-backend-llm:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    container_name: shop-frontend
    ports:
      - "8501:8501"
    # DEV: source code is bind-mounted into the container, so app.py edits are
    # visible after a simple `docker compose restart frontend` - no rebuild
    # required (pip deps live in site-packages, not in /app).
    volumes:
      - ./frontend:/app
    environment:
      - JAVA_API_BASE_URL=http://java-backend:8080
      - ML_API_BASE_URL=http://python-ml:8000
    depends_on:
      - java-backend
      - python-ml

  # One-shot service: prints the startup banner with working links once
  # every service answers. Runs automatically with `docker compose up -d`
  # (visible via `docker compose logs banner`), or in the FOREGROUND via
  # `docker compose run --rm banner` / the provided `up.ps1` helper.
  banner:
    image: curlimages/curl:8.10.1
    container_name: shop-banner
    depends_on:
      - frontend
      - java-backend
      - python-ml
    restart: "no"
    volumes:
      - ./ops/banner.sh:/banner.sh:ro
    entrypoint: ["sh", "/banner.sh"]

volumes:
  postgres_data:
