version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: shop-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etf_db
    ports:
      - "5432:5432"

  java-backend:
    build:
      context: ./engineer-backend-api
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    env_file:
      - ./engineer-backend-api/.env
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/etf_db
      - QUARKUS_DATASOURCE_USERNAME=user
      - QUARKUS_DATASOURCE_PASSWORD=password
      - TIINGO_API_KEY=${TIINGO_API_KEY}
      - ML_SERVICE_URL=http://python-ml:8000
    depends_on:
      - postgres

  python-ml:
    build:
      context: ./engineer-backend-llm
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: shop-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://java-backend:8080/api
    depends_on:
      - java-backend
      - python-ml
